<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Customer login — AVN Solar</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Unbounded:wght@600;700&display=swap">
<link rel="stylesheet" href="/admin/assets/admin.css">
<script defer src="/portal/assets/portal.js"></script>
<script defer src="/vendor/alpine.js"></script>
</head>
<body>
<div class="auth" style="background:#F4F7FC">
  <form class="modal" x-data="portalLogin" @submit.prevent="submit" x-cloak style="border:1px solid var(--line)">
    <a href="/" class="row" style="text-decoration:none;color:var(--ink)"><img src="/assets/logo.png" alt="AVN Solar logo" width="48" height="48" style="object-fit:contain"><b style="font-family:var(--display);font-size:18px">AVN Solar</b></a>
    <div>
      <h1 class="title" style="font-size:24px">Customer login</h1>
      <p class="muted" style="margin:4px 0 0">Track your installation, download documents and raise service requests.</p>
    </div>
    <div class="error" x-show="error" x-text="error" role="alert"></div>
    <label class="field">Customer ID or mobile number
      <input class="input" x-model="login" placeholder="AVN-2026-0001 or 98765 43210" autocomplete="username" required autofocus>
    </label>
    <label class="field">Password
      <input class="input" type="password" x-model="password" autocomplete="current-password" required>
    </label>
    <button class="btn dark" type="submit" :disabled="busy" style="min-height:52px;font-size:16px" x-text="busy ? 'Signing in…' : 'Sign in'"></button>
    <p class="small muted" style="margin:0">Your login details are shared by the AVN team when your project starts. Forgot your password? Call or WhatsApp us and we’ll reset it.</p>
    <a href="/#contact" class="small" style="font-weight:700">New to AVN? Book a free site survey</a>
  </form>
</div>
</body>
</html>

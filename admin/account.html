<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>My account — AVN Workspace</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Unbounded:wght@600;700&display=swap">
<link rel="stylesheet" href="/admin/assets/admin.css">
<script defer src="/admin/assets/app.js"></script>
<script defer src="/admin/assets/account.js"></script>
<script defer src="/vendor/alpine.js"></script>
</head>
<body>
<div class="app">
<aside id="side"></aside>
<main class="main" x-data="account" x-cloak>
  <div class="topbar">
    <div><h1 class="title">My account</h1><div class="sub" x-text="$store.app.user.name + ' · ' + ($store.app.user.role === 'admin' ? 'Admin' : 'Staff') + ' · @' + $store.app.user.username"></div></div>
  </div>
  <div class="card stack" style="max-width:520px">
    <template x-if="$store.app.user.mustChange">
      <div class="ok" style="background:var(--amber-bg);color:var(--amber-fg)">You are signed in with a temporary password. Type that temporary password below, then choose your own. Lost it? Ask another admin to reset it, or run the reset command on the server.</div>
    </template>
    <h2 class="h2">Change password</h2>
    <div class="error" x-show="error" x-text="error" role="alert"></div>
    <form class="stack" @submit.prevent="save" novalidate>
      <input type="text" autocomplete="username" :value="$store.app.user.email || $store.app.user.username" hidden aria-hidden="true">
      <label class="field"><span x-text="$store.app.user.mustChange ? 'Temporary password (the one you signed in with)' : 'Current password'">Current password</span>
        <span class="pwbox"><input class="input" :type="show ? 'text' : 'password'" x-model="current" autocomplete="current-password" @input="error = ''"><button type="button" class="pweye" @click="show = !show" :aria-label="show ? 'Hide passwords' : 'Show passwords'" x-text="show ? 'Hide' : 'Show'"></button></span></label>
      <label class="field">New password <small>at least 8 characters</small>
        <span class="pwbox"><input class="input" :type="show ? 'text' : 'password'" x-model="next" autocomplete="new-password" @input="error = ''"></span></label>
      <label class="field">Repeat new password
        <span class="pwbox"><input class="input" :type="show ? 'text' : 'password'" x-model="repeat" autocomplete="new-password" @input="error = ''"></span></label>
      <ul class="pwrules" aria-live="polite">
        <li :class="next.length >= 8 && 'pass'" x-text="(next.length >= 8 ? '✓ ' : '• ') + 'At least 8 characters' + (next && next.length < 8 ? ' (' + next.length + ' so far)' : '')"></li>
        <li :class="repeat && next === repeat && 'pass'" x-text="(repeat && next === repeat ? '✓ ' : '• ') + 'Both new passwords match'"></li>
        <li :class="next && next !== current && 'pass'" x-text="(next && next !== current ? '✓ ' : '• ') + 'Different from the current password'"></li>
      </ul>
      <button class="btn dark" type="submit" :disabled="busy" x-text="busy ? 'Saving…' : 'Save new password'">Save new password</button>
    </form>
  </div>
</main>
</div>
</body>
</html>

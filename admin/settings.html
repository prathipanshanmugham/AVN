<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Settings — AVN Workspace</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Unbounded:wght@600;700&display=swap">
<link rel="stylesheet" href="/admin/assets/admin.css">
<script defer src="/admin/assets/app.js"></script>
<script defer src="/admin/assets/settings.js"></script>
<script defer src="/vendor/alpine.js"></script>
</head>
<body>
<div class="app">
<aside id="side"></aside>
<main class="main" x-data="settings" x-cloak>
  <div class="topbar">
    <div><h1 class="title">Settings</h1><div class="sub" x-text="isAdmin ? 'Users, permissions and everything the website runs on.' : 'Your account. Only admins can change workspace settings.'"></div></div>
  </div>

  <div class="split">
    <nav class="list card stack secnav" style="flex:1 1 220px;padding:10px;gap:4px" aria-label="Settings sections">
      <template x-for="s in visibleSections" :key="s.id">
        <button type="button" class="btn navbtn" :class="sec === s.id && 'on'" :aria-pressed="sec === s.id" @click="sec = s.id" x-text="s.name"></button>
      </template>
    </nav>

    <section class="detail card stack" aria-label="Settings panel">
      <!-- Users -->
      <template x-if="sec === 'users'">
        <div class="stack">
          <div class="row between"><div><h2 class="h2">Users</h2><div class="muted">Two roles: <b>Admin</b> can do everything. <b>Staff</b> can open what Permissions allow.</div></div>
            <button class="btn primary" type="button" @click="openUser()">Add user</button></div>
          <div class="rows">
            <template x-for="u in users" :key="u.id">
              <div class="rowline" style="padding:10px 0">
                <div><b x-text="u.name"></b> <span class="badge" :class="u.role === 'admin' ? 'dark' : ''" x-text="u.role === 'admin' ? 'Admin' : 'Staff'"></span>
                  <span class="badge red" x-show="!u.active">Disabled</span><span class="badge amber" x-show="u.active && u.mustChange">Temporary password</span>
                  <div class="small muted" x-text="'@' + u.username + (u.email ? ' · ' + u.email : '') + ' · ' + (u.lastLogin ? 'last sign-in ' + AVN.when(u.lastLogin) : 'never signed in')"></div></div>
                <div class="row actions"><button class="btn sm" type="button" @click="openUser(u)">Edit</button>
                  <template x-if="u.id !== $store.app.user.id"><button class="btn sm" type="button" @click="resetUser(u)">Reset password</button></template>
                  <template x-if="u.id === $store.app.user.id"><a class="btn sm" href="/admin/account">Change my password</a></template></div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Permissions -->
      <template x-if="sec === 'permissions'">
        <div class="stack">
          <div><h2 class="h2">Permissions</h2><div class="muted">Choose what the Staff role can open. Admins always have full access. Settings, users and permissions are admin-only.</div></div>
          <div class="rows">
            <div class="rowline small muted" style="font-weight:700"><span>Section</span><span class="row" style="gap:28px"><span>Admin</span><span>Staff</span></span></div>
            <template x-for="m in modules" :key="m.id">
              <div class="rowline">
                <span><b x-text="m.name"></b><br><span class="small muted" x-text="m.desc"></span></span>
                <span class="row" style="gap:28px;flex-wrap:nowrap"><span class="badge green" title="Always on">✓</span>
                  <button type="button" class="switch" role="switch" :aria-checked="(!!perms[m.id]).toString()" :aria-label="'Staff can open ' + m.name" @click="togglePerm(m.id)"></button></span>
              </div>
            </template>
            <div class="rowline"><span><b>Settings, users &amp; permissions</b><br><span class="small muted">Company details, website settings, user accounts</span></span><span class="row" style="gap:28px"><span class="badge green">✓</span><span class="badge">Admin only</span></span></div>
          </div>
        </div>
      </template>

      <!-- Company / Website / Lead emails / Quotations forms -->
      <template x-if="FORM_SECTIONS.includes(sec)">
        <form class="stack" @submit.prevent="saveSettings()">
          <div><h2 class="h2" x-text="current.name"></h2><div class="muted" x-text="current.desc"></div></div>

          <template x-if="sec === 'leads'">
            <div class="stack">
              <div class="card tight small" style="background:#E6F2FC;border-color:#E6F2FC">
                <b>Every website enquiry is saved in the CRM.</b> Add an email server here to also get each one by email, with Call and WhatsApp buttons.<br>
                <b>Gmail:</b> smtp.gmail.com · port 465 · SSL on · your Gmail address · an <i>App password</i> (Google Account → Security → 2-Step Verification → App passwords).<br>
                <b>Hostinger email:</b> smtp.hostinger.com · port 465 · SSL on · the full mailbox address and its password.
              </div>
              <div :class="cfg.mail_status && cfg.mail_status.ok ? 'ok' : 'error'" x-show="cfg.mail_status" x-text="cfg.mail_status && ((cfg.mail_status.ok ? 'Last email: ' : 'Last email failed: ') + cfg.mail_status.message + ' · ' + AVN.when(cfg.mail_status.at.replace('T', ' ').slice(0, 19)))"></div>
            </div>
          </template>
          <template x-if="sec === 'seo'">
            <div class="stack" style="gap:10px">
              <div class="gpreview" aria-label="Google result preview">
                <span class="gp-site"><img src="/favicon.ico" alt="" width="18" height="18"><span><b x-text="cfg.brand_name || 'AVN Solar'"></b><small x-text="(cfg.site_url || 'https://avnsolar.in').replace(/\/$/, '')"></small></span></span>
                <span class="gp-title" x-text="cfg.site_title"></span>
                <span class="gp-desc" x-text="cfg.site_description"></span>
              </div>
              <div class="small muted">
                Title <b x-text="(cfg.site_title || '').length"></b> characters<span x-show="(cfg.site_title || '').length > 62"> — Google may cut it short</span> ·
                Description <b x-text="(cfg.site_description || '').length"></b> characters<span x-show="(cfg.site_description || '').length > 165"> — Google may cut it short</span>.
                Sitemap: <a :href="(cfg.site_url || '') + '/sitemap.xml'" target="_blank" rel="noopener" x-text="(cfg.site_url || '') + '/sitemap.xml'"></a> — submit it in Google Search Console.
              </div>
            </div>
          </template>
          <template x-if="sec === 'quotes' && !hasRates">
            <div class="card tight small" style="background:#FFF4C2;border-color:#FFE59A"><b>Add your ₹ per kWp rates</b> so new quotations fill in prices automatically. Rates are before GST. Staff can still change any price on a quotation.</div>
          </template>

          <div class="grid" style="--min:240px">
            <template x-for="f in fieldsFor(sec)" :key="f.k">
              <div :style="f.wide ? 'grid-column:1/-1' : ''">
                <template x-if="f.type === 'switch'">
                  <div class="rowline" style="min-height:44px"><span><b x-text="f.label"></b><br><span class="small muted" x-text="f.hint"></span></span>
                    <button type="button" class="switch" role="switch" :aria-checked="(cfg[f.k] === '1').toString()" :aria-label="f.label" @click="cfg[f.k] = cfg[f.k] === '1' ? '0' : '1'"></button></div>
                </template>
                <template x-if="f.type === 'components'">
                  <div class="stack" style="gap:8px">
                    <div><b>Component lines on new quotations</b><br><span class="small muted">The ₹ per kWp rate is shared across these lines by their share (re-balanced when a system has no battery). HSN/SAC and GST are starting points — confirm them with your CA. Every line can still be changed on the quotation.</span></div>
                    <div class="hsnsum" style="padding:0">
                      <div class="tablewrap" style="padding:0">
                        <table class="comp-table">
                          <thead><tr><th>Group</th><th>Line description</th><th>HSN/SAC</th><th>GST</th><th>Share</th></tr></thead>
                          <tbody>
                            <template x-for="c in comps" :key="c.key">
                              <tr>
                                <td><input class="input" x-model="c.group" :aria-label="'Group for ' + c.desc"></td>
                                <td><input class="input" x-model="c.desc" :aria-label="'Description for ' + c.key"><small class="muted" x-show="c.key === 'battery'">Hybrid and off-grid only</small></td>
                                <td><input class="input" x-model="c.hsn" inputmode="numeric" style="width:110px" :aria-label="'HSN or SAC for ' + c.desc"></td>
                                <td><select class="select" x-model.number="c.gst" :aria-label="'GST for ' + c.desc"><template x-for="g in [0, 5, 12, 18, 28]" :key="g"><option :value="g" x-text="g + '%'" :selected="Number(c.gst) === g"></option></template></select></td>
                                <td><input class="input" type="number" min="0" max="100" step="any" x-model.number="c.share" style="width:80px" :aria-label="'Price share for ' + c.desc"></td>
                              </tr>
                            </template>
                          </tbody>
                        </table>
                      </div>
                    </div>
                    <div class="small muted" x-text="'On-grid shares add up to ' + compShare + (compShare === 100 ? ' — good.' : ' — they are used as weights, so they need not add to 100.')"></div>
                  </div>
                </template>
                <template x-if="!['switch', 'components'].includes(f.type)">
                  <label class="field"><span x-text="f.label"></span> <small x-text="f.k === 'smtp_pass' && cfg.smtp_pass_set ? 'saved — leave blank to keep it' : f.hint"></small>
                    <template x-if="f.type === 'area'"><textarea class="textarea" :rows="f.rows || 3" x-model="cfg[f.k]"></textarea></template>
                    <template x-if="f.type === 'select'"><select class="select" x-model="cfg[f.k]"><template x-for="o in f.options" :key="o[0]"><option :value="o[0]" x-text="o[1]" :selected="cfg[f.k] === o[0]"></option></template></select></template>
                    <template x-if="!['area', 'select'].includes(f.type)"><input class="input" :type="f.type || 'text'" :step="f.type === 'number' ? 'any' : null" x-model="cfg[f.k]" :placeholder="f.k === 'smtp_pass' && cfg.smtp_pass_set ? '••••••••' : (f.ph || '')" :autocomplete="f.type === 'password' ? 'new-password' : 'off'"></template>
                  </label>
                </template>
              </div>
            </template>
          </div>
          <div class="row">
            <button class="btn dark" type="submit">Save changes</button>
            <button class="btn" type="button" x-show="sec === 'leads'" :disabled="testing" @click="testEmail()" x-text="testing ? 'Sending…' : 'Send test email'"></button>
            <a class="btn" x-show="sec === 'quotes'" href="/admin/quotes">Open quotations</a>
          </div>
        </form>
      </template>

      <!-- Account -->
      <template x-if="sec === 'account'">
        <div class="stack">
          <h2 class="h2">My account</h2>
          <div class="muted" x-text="$store.app.user.name + ' · @' + $store.app.user.username"></div>
          <div><a class="btn dark" href="/admin/account">Change my password</a></div>
        </div>
      </template>
    </section>
  </div>

  <!-- User modal -->
  <div class="overlay center" x-show="modal" x-transition.opacity @click.self="modal = null">
    <form class="modal" x-show="modal === 'user'" @submit.prevent="saveUser()">
      <h2 class="h2" x-text="uform.id ? 'Edit user' : 'Add user'"></h2>
      <div class="error" x-show="error" x-text="error"></div>
      <div class="grid" style="--min:200px">
        <label class="field">Full name<input class="input" x-model="uform.name" required></label>
        <label class="field">Username <small>for signing in</small><input class="input" x-model="uform.username" :disabled="!!uform.id" required pattern="[A-Za-z0-9._\-]{3,40}"></label>
        <label class="field">Email <small>optional</small><input class="input" type="email" x-model="uform.email"></label>
        <label class="field">Role<select class="select" x-model="uform.role"><option value="staff">Staff</option><option value="admin">Admin</option></select></label>
        <label class="field" x-show="!uform.id">Password <small>blank = generate one</small><input class="input" x-model="uform.password" minlength="10" autocomplete="new-password"></label>
        <label class="field" x-show="uform.id">Status<select class="select" x-model="uform.active"><option value="1">Active</option><option value="0">Disabled</option></select></label>
      </div>
      <div class="row"><button class="btn dark" type="submit">Save</button><button class="btn" type="button" @click="modal = null">Cancel</button></div>
    </form>
    <div class="modal" x-show="modal === 'secret'">
      <h2 class="h2">Temporary password</h2>
      <p class="muted" style="margin:0">Give this to <b x-text="secret.name"></b> (username <b x-text="secret.username"></b>). It is shown only now, and they will set their own password after signing in at <b x-text="location.origin + '/admin'"></b>.</p>
      <div class="secret"><span x-text="secret.password"></span><button class="btn sm" type="button" @click="AVN.copy(secret.password)">Copy</button></div>
      <div><button class="btn" type="button" @click="modal = null">Done</button></div>
    </div>
  </div>
</main>
</div>
</body>
</html>
